<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VHVR STORE</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }
    .card {
      background: #151d33;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 15px;
    }
    input, select, textarea, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #354361;
      font-size: 15px;
    }
    input, select, textarea {
      background: #0b1224;
      color: white;
    }
    button {
      background: #6ee7b7;
      color: #08221a;
      font-weight: bold;
      cursor: pointer;
    }
    #status {
      white-space: pre-wrap;
      line-height: 1.5;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>VHVR STORE</h1>
    <p>Layanan digital dan freelance online.</p>
  </div>

  <div class="card">
    <h2>Formulir Pesanan</h2>

    <form id="orderForm">
      <input id="nama" placeholder="Nama kamu" maxlength="80" required>

      <select id="produk" required>
        <option value="">Pilih layanan</option>
        <option>Desain banner atau logo</option>
        <option>Penulisan caption</option>
        <option>Input data online</option>
        <option>Layanan lainnya</option>
      </select>

      <textarea id="detail" placeholder="Jelaskan pesanan kamu" maxlength="1000" required></textarea>

      <input id="kontak" placeholder="Username Telegram (opsional)" maxlength="100">

      <button id="kirim" type="submit">Kirim Pesanan</button>
      <div id="status" role="status"></div>
    </form>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    document.getElementById("orderForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const tombol = document.getElementById("kirim");
      const status = document.getElementById("status");

      const nama = document.getElementById("nama").value.trim();
      const produk = document.getElementById("produk").value;
      const detail = document.getElementById("detail").value.trim();
      const kontak = document.getElementById("kontak").value.trim();

      tombol.disabled = true;
      tombol.textContent = "Mengirim...";
      status.textContent = "";

      try {
        const response = await fetch(
          "https://vhvr-notifikasi.dhiermanantasari.workers.dev/order",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              product: produk,
              detail:
                "Nama: " + nama +
                "\nPesanan: " + detail +
                "\nKontak: " + (kontak || "Tidak dicantumkan")
            })
          }
        );

        if (!response.ok) {
          throw new Error("Gagal mengirim pesanan");
        }

        const hasil = await response.json();

        if (!hasil.ok) {
          throw new Error("Notifikasi belum dikonfirmasi");
        }

        status.textContent = "Pesanan berhasil dikirim ke admin!";
        this.reset();

      } catch (error) {
        status.textContent =
          "Pesanan gagal dikirim otomatis. Periksa konfigurasi Cloudflare Worker.";
      } finally {
        tombol.disabled = false;
        tombol.textContent = "Kirim Pesanan";
      }
    });
  </script>

</body>
</html>
